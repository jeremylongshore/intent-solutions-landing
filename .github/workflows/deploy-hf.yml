name: deploy-hf

# Auto-deploy the built Astro site to the Hugging Face static Space
# (intent-solutions-io/home), which mirrors intentsolutions.io. Same source as the
# VPS deploy — HF is a second target.
#
# Deploys with a plain git + git-lfs push (NOT `hf upload`): `hf upload` first calls
# the repo-create API, which an organization without a paid plan cannot do (HTTP 402),
# even for an already-existing FREE static Space. A git push to the existing Space repo
# never touches repo-create, and git-lfs (preinstalled on the runner) stores the binary
# assets that HF requires to be in LFS.

on:
  push:
    branches: [main]
    paths:
      - 'astro-site/**'
      - '.github/workflows/deploy-hf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Build the Astro site
        working-directory: astro-site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy the build to the Space (git + LFS)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          # The Space config file HF reads for its static-Space settings.
          cat > astro-site/dist/README.md <<'EOF'
          ---
          title: Intent Solutions
          emoji: 🧭
          colorFrom: gray
          colorTo: blue
          sdk: static
          app_file: index.html
          pinned: true
          ---

          Intent Solutions — auto-deployed from `intent-solutions-landing/astro-site`
          (the same source as https://intentsolutions.io).
          EOF

          git config --global user.email "jeremy@intentsolutions.io"
          git config --global user.name "Intent Solutions CI"
          # Feed the token via a credential helper so it is not baked into the remote URL.
          git config --global credential.helper store
          printf 'https://JLongshore:%s@huggingface.co\n' "$HF_TOKEN" > "$HOME/.git-credentials"

          git clone https://huggingface.co/spaces/intent-solutions-io/home hf-space
          cd hf-space
          git lfs install --local

          # HF requires binary media to be tracked in LFS. Track BEFORE replacing the
          # contents: `git lfs track` touches every already-tracked file that matches,
          # and exits 2 ("chtimes: no such file") when a previously deployed binary
          # has been removed from the build (2026-09-06, run 34068001756).
          # PDFs too: the Space's pre-receive hook rejected the plain-git
          # intent-solutions-operating-atlas.pdf on every push since 2026-10-12.
          git lfs track "*.jpg" "*.jpeg" "*.png" "*.gif" "*.webp" "*.avif" "*.ico" \
                        "*.mp4" "*.mov" "*.webm" "*.woff" "*.woff2" "*.ttf" "*.otf" \
                        "*.pdf" >/dev/null

          # Fail here, naming the file, if the build ships a binary type the list misses.
          untracked_binaries=$(cd ../astro-site/dist && find . -type f -print0 \
            | xargs -0 file -N -F '|' --mime-encoding | awk -F'|' '$2 ~ /^ *binary$/{print $1}' \
            | while read -r f; do
                git -C "$OLDPWD" check-attr filter -- "${f#./}" | grep -q 'filter: lfs' || echo "$f"
              done)
          if [ -n "$untracked_binaries" ]; then
            echo "::error::Binary files not tracked by LFS (add their extension above):"
            echo "$untracked_binaries"
            exit 1
          fi

          # Replace the Space contents with the fresh build (keep .git and .gitattributes).
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.gitattributes' -exec rm -rf {} +
          cp -a ../astro-site/dist/. .

          git add -A
          git commit -m "Deploy intentsolutions.io from CI — ${{ github.sha }}" \
            || { echo "no changes to deploy"; exit 0; }
          git push origin HEAD:main
