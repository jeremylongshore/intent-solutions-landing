name: Estate bar

# The canonical network strip for every Intent Solutions property lives in
# estate-bar/. This fails if dist/ or the manifest is stale, or if the checker
# stops catching drift.

on:
  pull_request:
    paths: ['estate-bar/**', '.github/workflows/estate-bar.yml']
  push:
    branches: [main]
    paths: ['estate-bar/**', '.github/workflows/estate-bar.yml']

permissions:
  contents: read

jobs:
  verify:
    name: estate bar is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: dist and manifest match links.json
        run: node estate-bar/render.mjs --check
      - name: checker passes a good page and fails a drifted one
        run: bash estate-bar/selftest.sh
